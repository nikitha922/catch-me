<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1013" />
    <title>Catch Me</title>
  </head>
  <body>
    <main id="stage">
      <header class="hud">
        <h1>Catch me<span>.</span></h1>
        <div class="stats">
          <div><small>Dodges</small><b id="dodges">0</b></div>
        </div>
      </header>

      <p id="taunt" class="taunt" aria-live="polite">Go on. Click the button.</p>

      <canvas id="game" role="img" aria-label="A button that dodges your cursor. Try to click it."></canvas>
      <canvas id="fx" aria-hidden="true"></canvas>

      <section id="win" class="win" hidden role="dialog" aria-modal="true" aria-labelledby="win-title">
        <div class="win-card">
          <h2 id="win-title">Gotcha!</h2>
          <p id="win-sub"></p>
          <dl>
            <div><dt>Dodges</dt><dd id="w-dodges"></dd></div>
          </dl>
          <div class="win-actions">
            <button id="again" class="btn" type="button">Play again</button>
          </div>
        </div>
      </section>

      <section id="spy" class="spy" hidden role="alert">
        <div class="spy-card">
          <svg class="sticker" viewBox="0 0 160 160" aria-hidden="true">
            <defs>
              <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
                <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity=".45" />
              </filter>
            </defs>
            <g filter="url(#sh)">
              <circle cx="80" cy="80" r="70" fill="#fff" />
              <circle cx="80" cy="80" r="62" fill="#ffd166" stroke="#1a1410" stroke-width="4" />
              <!-- eyes, glancing sideways -->
              <ellipse cx="55" cy="72" rx="16" ry="19" fill="#fff" stroke="#1a1410" stroke-width="3.5" />
              <ellipse cx="105" cy="72" rx="16" ry="19" fill="#fff" stroke="#1a1410" stroke-width="3.5" />
              <circle cx="48" cy="74" r="7.5" fill="#1a1410" />
              <circle cx="98" cy="74" r="7.5" fill="#1a1410" />
              <!-- one flat brow, one raised -->
              <path d="M36 52 L72 56" stroke="#1a1410" stroke-width="6" stroke-linecap="round" />
              <path d="M90 40 Q106 28 124 42" fill="none" stroke="#1a1410" stroke-width="6" stroke-linecap="round" />
              <!-- smirk -->
              <path d="M54 112 Q82 120 112 102" fill="none" stroke="#1a1410" stroke-width="5" stroke-linecap="round" />
            </g>
          </svg>
          <h2>I see what you’re doing…</h2>
          <p>Close the dev tools and I’ll come back.</p>
        </div>
      </section>

      <p id="notice" class="notice" role="status" aria-live="polite"></p>

      <p class="hint">Try to click the button.</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
